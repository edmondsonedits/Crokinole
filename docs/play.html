<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#17120e">
<title>Crokinole — Play</title>
<style>html,body{margin:0;min-height:100%;background:#17120e;color:#f7ead8;font-family:system-ui,sans-serif}body{min-height:100dvh;display:grid;place-items:center}main{text-align:center;padding:28px;max-width:520px}h1{margin:0 0 8px}.small{color:#c4ae95;font-size:14px;line-height:1.45}.err{display:none;color:#f2cb87}.retry{display:none;margin:18px auto 0;padding:12px 18px;border:0;border-radius:10px;background:#e6a952;color:#2b1a0d;font-weight:800}</style>
</head>
<body><main id="loading"><h1>Crokinole</h1><p class="small">Loading the playable build…</p><p class="err" id="err">The game could not be loaded from GitHub. Check your connection and retry.</p><button class="retry" id="retry" onclick="location.reload()">Retry</button></main>
<script>
(async()=>{try{const u='https://raw.githubusercontent.com/edmondsonedits/Crokinole/main/index.html?ts='+Date.now();const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const html=await r.text();if(!html.includes('<canvas id="game"'))throw new Error('Unexpected game file');document.open();document.write(html);document.close();}catch(e){console.error(e);document.getElementById('err').style.display='block';document.getElementById('retry').style.display='block';}})();
</script></body>
</html>
